# Deploy Command HQ (U29): build the web SPA, synth all CDK stacks, and
# (guarded) deploy them.
#
# Guardrails — this never deploys by accident:
#   * The `deploy` job only runs on a manual `workflow_dispatch` with `deploy:
#     true`, and is pinned to the protected `production` GitHub Environment
#     (approvals/secrets gated there).
#   * `cdk bootstrap` is a one-time manual prerequisite per account/region and is
#     deliberately NOT run here.
#   * On `push` / `pull_request` only the build + synth job runs (no AWS creds,
#     no deploy) — a pure verification gate.
name: deploy

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Actually deploy to AWS (otherwise build + synth only)'
        type: boolean
        default: false

# OIDC role assumption for the deploy job; read-only otherwise.
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  # U10 / MAT-141 Gap 4: learning-service CI gate.
  # Runs (a) the Python codegen freshness check (fails if IDL changed without
  # regenerating py_types.py + ts_types.ts + shared/src/learning-schema.ts) and
  # (b) the full learning-service pytest suite.  Both must pass before the TS
  # build + CDK synth jobs run.
  learning-service-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install learning-service + agent-families store-free core
        working-directory: packages/learning-service
        run: |
          pip install -e ".[dev]"
          # The learning loop reuses agent-families' STORE-FREE core (nli.py /
          # judge.py). Install it editable WITHOUT its deps so the sqlite-vec /
          # store coupling (banned from the live loop — see
          # test_no_sqlite_vec_in_learning_service) is never pulled in; the
          # store-free modules import fine on their own.
          pip install -e ../../agent-families --no-deps
      - name: Codegen freshness check (fails if IDL is stale)
        working-directory: packages/learning-service
        run: python -m learning_service.schema.codegen --check
      - name: Run learning-service pytest suite
        working-directory: packages/learning-service
        run: python -m pytest tests/ -v --tb=short

  build-and-synth:
    runs-on: ubuntu-latest
    needs: learning-service-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install workspaces
        run: npm ci
      - name: Build shared + backend + web
        run: npm run build
      # U10 / MAT-141 Gap 4: run the TS test suites so a failing test (e.g. the
      # single-writer routing / no-hand-mirror guards) actually fails CI, not just
      # the learning-service pytest gate above.
      - name: Run TS test suites
        run: npm run test
      - name: Synth all CDK stacks
        working-directory: infra
        run: npx cdk synth
        env:
          # SearchStack is not in the synth app; the device-token secret is
          # sourced from env so the synthesized API never carries the literal
          # placeholder fallback.
          DEVICE_TOKEN_SECRET: ${{ secrets.DEVICE_TOKEN_SECRET }}
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist
          if-no-files-found: error

  deploy:
    needs: build-and-synth
    # Guard: only on an explicit manual dispatch that opts into deploying.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    runs-on: ubuntu-latest
    # Protected environment: approvals + scoped secrets live here.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install workspaces
        run: npm ci
      - name: Build web (BucketDeployment sources packages/web/dist)
        run: npm run build -w @harness/web
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # NOTE: `cdk bootstrap` is a one-time manual prerequisite per
      # account/region and is intentionally not run here.
      # `--all` covers AuthStack, ApiStack, and SiteStack only — the OpenSearch
      # SearchStack is not in the synth app, so it can never deploy here.
      - name: CDK deploy (all stacks, cache-invalidating site deploy)
        working-directory: infra
        run: npx cdk deploy --all --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          # The real device-token signing secret — never the literal fallback.
          DEVICE_TOKEN_SECRET: ${{ secrets.DEVICE_TOKEN_SECRET }}
      # Seed the bundled product skills into HQ for EVERY org (plan U22) so the
      # Skills tab shows the "command-hq-starter" bundle out of the box in every
      # tenant. `seed-all-orgs.mjs` enumerates the ORG# records and seeds the
      # starter bundle into each (plus the user-grant built-ins once); it reads
      # catalog/skills/ and the compiled backend record builder. Idempotent
      # (upsert), so it is safe to run on every deploy.
      - name: Build shared + backend (seed reads packages/backend/dist)
        run: npm run build -w @harness/shared -w @harness/backend
      - name: Seed bundled skills into HQ (every org)
        run: node infra/scripts/seed-all-orgs.mjs
        env:
          HARNESS_TABLE: harness
          AWS_REGION: ${{ env.AWS_REGION }}
