# Release the claude+ wrapper on tag (U18).
#
# Cross-compiles via goreleaser, publishes the GitHub release with archives +
# checksums, then publishes the npm wrapper package and its per-platform binary
# packages. Also runs a smoke job that installs via npm in a clean container and
# runs `claude+ --version` and `claude+ ls`.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: wrapper/go.sum
      - name: go test
        working-directory: wrapper
        run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
          workdir: wrapper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      # The per-platform @claude-plus/* packages are assembled from the release
      # archives by scripts/pack-npm.js (downloads each archive, lays the binary
      # into the package), then published alongside the launcher package.
      - name: Publish npm wrapper
        working-directory: npm/claude-plus
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke:
    needs: npm-publish
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install via npm
        run: npm i -g claude-plus
      - name: Smoke check
        run: |
          claude+ --version
          claude+ ls

  # Build the Wails desktop app (wrapper/cmd/claude-plus-desktop) across OSes and
  # upload each platform binary as an artifact. Independent of the goreleaser/npm
  # pipeline above — runs straight off the tagged source.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: wrapper/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Wails on Linux links against GTK3 + WebKit2GTK; install them before build.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build desktop app
        working-directory: wrapper/cmd/claude-plus-desktop
        run: wails build -clean -platform ${{ runner.os == 'Windows' && 'windows/amd64' || runner.os == 'macOS' && 'darwin/universal' || 'linux/amd64' }}
      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: claude-plus-desktop-${{ matrix.os }}
          path: wrapper/cmd/claude-plus-desktop/build/bin/
