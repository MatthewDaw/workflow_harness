[project]
name = "agent-families"
version = "0.0.0"
description = "Agent-families: a self-improving skill library for agent training (Phase 0 — library core)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "graspologic-native>=1.3.0",
    "infomap>=2.12.0",
    "sentence-transformers[onnx]>=5.0",
    "sqlite-vec==0.1.9",
]

[project.scripts]
af = "agent_families.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_families"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-subprocess>=1.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: tests that load the real embedding model (skipped by default offline runs may opt in)",
  "docker: tests that require Docker to be available",
]
