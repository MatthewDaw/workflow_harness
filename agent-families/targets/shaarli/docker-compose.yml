# shaarli held-out suite target (plan-005 U1, R1/R2 — the generalization suite).
#
# Shaarli is a held-out BENCHMARK target: the bookmarks archetype (same archetype
# as the training target linkding, a DIFFERENT instance) — so a score here
# measures generalization, never novelty shock. It is NEVER trained on: the
# curriculum's held-out constraint (curriculum.HELD_OUT) refuses to admit it to
# the training pool, and suite.assert_held_out rejects any training-pool name as
# a suite target.
#
# Image pinned BY DIGEST (R9, inherited from the Phase 2 harness contract: every
# cached apparatus artifact is keyed to this digest; a tag alone drifts
# silently). suite.py carries the same pin and the generic SuiteTargetEnv refuses
# setup if this file and the code ever disagree.
#
# NOTE — the digest below is a PLACEHOLDER pending live resolution from Docker
# Hub (this unit's host had no network/docker; the live boot/seed and the
# Gauge-style measurements are documented pending-docker deliverables). SAFE:
# SuiteTargetEnv.up() verifies the running image's RepoDigests contain the pin
# and refuses a mismatch (DigestMismatchError), so a stale placeholder can never
# silently run the benchmark against the wrong image. Re-pinning is a deliberate
# apparatus migration, not an edit.
#
# - named volume, NEVER a Windows bind mount (SQLite WAL corruption risk, R5)
# - host port 8082, disjoint from linkding=9090, clone=4173, kanboard=8081 and
#   the other suite targets by construction (suite.SUITE_PORTS asserts it)
# - readiness is suite.py polling GET / for the "Shaarli" marker
name: agent-families-shaarli

services:
  shaarli:
    image: shaarli/shaarli:v0.13.0@sha256:b1c2d3e4f5061728293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f01
    ports:
      - "8082:80"
    volumes:
      - shaarli_data:/var/www/shaarli/data
    restart: unless-stopped

volumes:
  shaarli_data:
