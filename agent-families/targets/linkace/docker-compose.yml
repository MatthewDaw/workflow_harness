# linkace target stack (plan-005 U1, R1 — a held-out benchmark-suite target).
#
# LinkAce is a self-hosted bookmark/link manager. It is the held-out BOOKMARKS
# instance: linkding is the *training* bookmarks target, so measuring LinkAce
# tests generalization WITHIN the archetype (same archetype, different instance —
# DESIGN §11), not novelty shock. It is never trained on (R1/R2).
#
# Image pinned BY DIGEST (R9, inherited from the Phase 2 harness contract: the
# FEAT registry and every cached apparatus artifact are keyed to this digest; a
# tag alone can drift silently). suite.py carries the same archetype/dir wiring.
#
# NOTE — the digest below is a PLACEHOLDER pending live resolution from Docker
# Hub (this unit's host had no network/docker; the live boot/seed and the
# hand-verification of LINKACE_SLICE's reference verdicts are the documented
# pending-docker deliverables, mirroring Kanboard's R22). This is SAFE: the
# target-generic harness verifies the running image's RepoDigests contain the
# pin and refuses a mismatch (DigestMismatchError), so a stale placeholder can
# never silently run the benchmark against the wrong image — it fails loud until
# re-pinned. Re-pinning is a deliberate apparatus migration, not an edit.
#
# - named volume, NEVER a Windows bind mount (SQLite WAL corruption risk, R5)
# - LinkAce auto-provisions its SQLite DB on first boot; seeding drives the REST
#   API headlessly (POST /api/v1/links with a Bearer token)
# - host port comes from suite.py (8082), disjoint from the linkding port table
#   (linkding=9090, clone=4173) and from Kanboard (8081) by construction
# - readiness is the generic harness polling GET / for the LinkAce login marker,
#   not a compose healthcheck
name: agent-families-linkace

services:
  linkace:
    image: linkace/linkace:v1.15.6@sha256:b1c2d3e4f5a60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
    ports:
      - "8082:80"
    volumes:
      - linkace_data:/app/database
    environment:
      # Deterministic, headless: SQLite backend, no outbound mail, no setup wizard.
      DB_CONNECTION: sqlite
      APP_ENV: local
      MAIL_MAILER: log
    restart: unless-stopped

volumes:
  linkace_data:
