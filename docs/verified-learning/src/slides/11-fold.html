<!-- 11 · Corroborate -> fold -->
<section class="slide" id="slide-11" data-title="Fold"
  data-narration="Corroborating evidence accumulates on the idea. Each supporting pull request adds its weight. When the total crosses the verified threshold, the idea folds — it's promoted into a written skill the agent can actually use, and a golden example is captured alongside it as proof the lesson holds.">
  <style>
    #slide-11 .stage{height:min(44vh,400px)}
    #slide-11 .meterbg{fill:rgba(255,255,255,.06);stroke:var(--line)}
    #slide-11 .fill{fill:url(#s11g)}
    #slide-11.active .fill{animation:s11fill 2.4s cubic-bezier(.3,.8,.3,1) forwards;transform-box:fill-box;transform-origin:left}
    #slide-11 .fill{transform:scaleX(0)}
    @keyframes s11fill{to{transform:scaleX(1)}}
    #slide-11.active .stamp{animation:s11stamp .6s cubic-bezier(.2,1.5,.4,1) 2.2s both}
    #slide-11 .stamp{opacity:0;transform:scale(2) rotate(-12deg);transform-box:fill-box;transform-origin:center}
    @keyframes s11stamp{to{opacity:1;transform:scale(1) rotate(-9deg)}}
  </style>
  <h2 class="headline reveal" style="--d:.05s">Evidence crosses the line → <span class="t-teal">fold</span></h2>
  <div class="stage">
    <svg viewBox="0 0 860 360" width="100%" height="100%">
      <defs><linearGradient id="s11g" x1="0" x2="1"><stop offset="0" stop-color="var(--teal)"/><stop offset="1" stop-color="var(--violet)"/></linearGradient></defs>
      <!-- contributing PRs -->
      <g font-size="12" font-family="monospace" text-anchor="middle">
        <g class="pop" style="--d:.3s"><rect x="20" y="60" width="120" height="34" rx="9" fill="var(--card2)" stroke="var(--line)"/><text x="80" y="82" fill="#cdd7f5">PR · +0.9</text></g>
        <g class="pop" style="--d:.5s"><rect x="20" y="104" width="120" height="34" rx="9" fill="var(--card2)" stroke="var(--line)"/><text x="80" y="126" fill="#cdd7f5">PR · +0.6</text></g>
        <g class="pop" style="--d:.7s"><rect x="20" y="148" width="120" height="34" rx="9" fill="var(--card2)" stroke="var(--line)"/><text x="80" y="170" fill="#cdd7f5">PR · +0.5</text></g>
      </g>
      <path class="draw" style="--d:.9s" d="M142,120 C200,120 200,150 250,150" stroke="var(--line)" stroke-width="2" fill="none" pathLength="1"/>

      <!-- meter -->
      <g class="reveal" style="--d:1s">
        <rect class="meterbg" x="250" y="126" width="380" height="48" rx="24"/>
        <rect class="fill" x="252" y="128" width="376" height="44" rx="22"/>
        <line x1="560" y1="110" x2="560" y2="190" stroke="var(--amber)" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="560" y="104" text-anchor="middle" fill="var(--amber)" font-size="12">verified_K</text>
        <text x="440" y="210" text-anchor="middle" fill="var(--mut)" font-size="13">accumulated weight</text>
      </g>

      <!-- skill output -->
      <line class="draw" style="--d:1.6s" x1="632" y1="150" x2="690" y2="150" stroke="var(--teal)" stroke-width="2.5" pathLength="1"/>
      <g class="pop" style="--d:1.8s">
        <rect x="692" y="86" width="150" height="128" rx="14" fill="rgba(45,212,191,.10)" stroke="var(--teal)"/>
        <text x="767" y="120" text-anchor="middle" font-size="26">📜</text>
        <text x="767" y="150" text-anchor="middle" fill="var(--teal)" font-size="14" font-weight="800">SKILL</text>
        <text x="767" y="174" text-anchor="middle" fill="var(--mut)" font-size="11">written revision</text>
        <text x="767" y="196" text-anchor="middle" fill="var(--mut)" font-size="11">+ golden case ✓</text>
      </g>

      <!-- folded stamp -->
      <g class="stamp"><rect x="350" y="250" width="180" height="56" rx="12" fill="none" stroke="var(--teal)" stroke-width="3"/><text x="440" y="288" text-anchor="middle" fill="var(--teal)" font-size="26" font-weight="900" letter-spacing="2">FOLDED</text></g>
    </svg>
  </div>
</section>
