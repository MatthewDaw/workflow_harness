<!-- 12 · Supersede & revive -->
<section class="slide" id="slide-12" data-title="Supersede & revive"
  data-narration="Knowledge changes, and the graph keeps up. When a pull request contradicts a folded lesson, it supersedes it — the old idea is stamped invalid and un-folded. And if a later change re-teaches that same lesson, the idea revives. The knowledge always tracks the current state of the codebase.">
  <style>
    #slide-12 .stage{height:min(44vh,400px)}
    #slide-12 .rail{stroke:var(--line);stroke-width:3}
    #slide-12 .ev{fill:var(--card2);stroke:var(--line)}
    #slide-12.active .x{animation:s12x 1.6s ease-in-out infinite}
    @keyframes s12x{0%,100%{opacity:.6}50%{opacity:1}}
  </style>
  <h2 class="headline plain reveal" style="--d:.05s">Knowledge that <span class="t-teal">stays current</span></h2>
  <div class="stage">
    <svg viewBox="0 0 900 320" width="100%" height="100%">
      <line class="rail draw" style="--d:.3s" x1="60" y1="170" x2="840" y2="170" pathLength="1"/>

      <!-- 1 folded -->
      <g class="pop" style="--d:.5s">
        <circle class="ev" cx="160" cy="170" r="34" fill="rgba(45,212,191,.12)" stroke="var(--teal)"/>
        <text x="160" y="166" text-anchor="middle" fill="var(--teal)" font-size="12">idea</text>
        <text x="160" y="182" text-anchor="middle" fill="var(--teal)" font-size="11">folded</text>
        <text x="160" y="232" text-anchor="middle" fill="var(--mut)" font-size="12">① trusted lesson</text>
      </g>

      <!-- 2 contradiction supersedes -->
      <g class="pop" style="--d:.9s">
        <rect class="ev" x="350" y="92" width="150" height="40" rx="10" stroke="var(--rose)"/>
        <text x="425" y="118" text-anchor="middle" fill="var(--rose)" font-size="12">contradicting PR</text>
        <path class="draw" style="--d:1.1s" d="M425,132 L425,150" stroke="var(--rose)" stroke-width="2" pathLength="1"/>
        <circle class="ev x" cx="425" cy="170" r="34" fill="rgba(251,113,133,.10)" stroke="var(--rose)" stroke-dasharray="4 4"/>
        <text x="425" y="176" text-anchor="middle" fill="var(--rose)" font-size="18">⊘</text>
        <text x="425" y="232" text-anchor="middle" fill="var(--rose)" font-size="12">② superseded · un-folded</text>
        <text x="425" y="250" text-anchor="middle" fill="var(--mut)" font-size="11">invalidAt stamped</text>
      </g>

      <!-- 3 revive -->
      <g class="pop" style="--d:1.4s">
        <rect class="ev" x="640" y="92" width="150" height="40" rx="10" stroke="var(--green)"/>
        <text x="715" y="118" text-anchor="middle" fill="var(--green)" font-size="12">re-teaches it</text>
        <path class="draw" style="--d:1.6s" d="M715,132 L715,150" stroke="var(--green)" stroke-width="2" pathLength="1"/>
        <circle class="ev" cx="715" cy="170" r="34" fill="rgba(52,211,153,.12)" stroke="var(--green)"/>
        <text x="715" y="176" text-anchor="middle" fill="var(--green)" font-size="18">↻</text>
        <text x="715" y="232" text-anchor="middle" fill="var(--green)" font-size="12">③ revived</text>
        <text x="715" y="250" text-anchor="middle" fill="var(--mut)" font-size="11">invalidAt cleared</text>
      </g>
    </svg>
  </div>
</section>
