<!-- 03 · Trigger -->
<section class="slide" id="slide-03" data-title="Trigger"
  data-narration="It starts with a single action. You point Verified Learning at a repository and hit run. There's no labeling and no manual curation. From here, everything is automatic — it can read a public repo's git history, or your own sessions captured in Command HQ.">
  <style>
    #slide-03 .stage{height:min(40vh,360px)}
    #slide-03 .box{fill:var(--card);stroke:var(--line)}
    #slide-03 .runbtn{fill:url(#s03g)}
    #slide-03.active .go{animation:s03go 1.6s ease-in-out infinite}
    @keyframes s03go{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    #slide-03 .go{transform-origin:330px 150px}
    #slide-03.active .arrow{animation:s03dash 1.1s linear infinite}
    @keyframes s03dash{to{stroke-dashoffset:-26}}
  </style>
  <h2 class="headline reveal" style="--d:.05s">Point at a repo. Hit run.</h2>
  <div class="stage">
    <svg viewBox="0 0 740 300" width="100%" height="100%">
      <defs><linearGradient id="s03g" x1="0" x2="1"><stop offset="0" stop-color="var(--teal)"/><stop offset="1" stop-color="var(--violet)"/></linearGradient></defs>
      <!-- repo -->
      <g class="reveal" style="--d:.3s">
        <rect class="box" x="40" y="96" width="170" height="108" rx="16"/>
        <text x="125" y="140" text-anchor="middle" font-size="30">📦</text>
        <text x="125" y="172" text-anchor="middle" fill="#cdd7f5" font-size="14" font-family="monospace">owner / repo</text>
      </g>
      <line class="arrow" x1="218" y1="150" x2="262" y2="150" stroke="var(--mut)" stroke-width="3" stroke-dasharray="5 8"/>
      <!-- run button -->
      <g class="go pop" style="--d:.6s">
        <rect class="runbtn" x="270" y="120" width="120" height="60" rx="14"/>
        <text x="330" y="158" text-anchor="middle" fill="#06121a" font-size="20" font-weight="800">▶ RUN</text>
      </g>
      <line class="arrow" x1="398" y1="150" x2="442" y2="150" stroke="var(--mut)" stroke-width="3" stroke-dasharray="5 8"/>
      <!-- pipeline -->
      <g class="reveal" style="--d:.9s">
        <rect class="box" x="450" y="96" width="250" height="108" rx="16"/>
        <text x="575" y="135" text-anchor="middle" fill="#cdd7f5" font-size="15">automatic pipeline</text>
        <g fill="var(--teal)"><circle cx="498" cy="166" r="6"/><circle cx="540" cy="166" r="6"/><circle cx="582" cy="166" r="6"/><circle cx="624" cy="166" r="6"/><circle cx="666" cy="166" r="6"/></g>
        <line x1="498" y1="166" x2="666" y2="166" stroke="var(--line)"/>
      </g>
    </svg>
  </div>
  <p class="sub reveal" style="--d:1.1s">No labels. No curation. Public git history <span class="t-violet">or</span> your captured sessions.</p>
</section>
